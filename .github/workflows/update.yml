name: update-data
on:
  workflow_dispatch:   # 数据由本机定时任务抓取并推送，此处仅保留手动触发
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scrape
        env:
          WM_OUT: "."
        run: python3 scraper.py
      - name: commit
        run: |
          git config user.name "wm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json data.js history.json history.csv || true
          git diff --cached --quiet || { git commit -m "data: $(date -u +%Y-%m-%d)"; git push; }
