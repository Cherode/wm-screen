<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b8c">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>短钱理财筛 · R1/R2 ≤30天</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--ink:#101828;--sub:#667085;--line:#e6e8ec;--bg:#f5f6f8;--card:#fff;--blue:#0b3b8c;--red:#c0392b;--green:#1e7e46;--amber:#b45309;--r:14px}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;overflow-x:hidden}
  header{position:sticky;top:0;z-index:9;background:linear-gradient(135deg,#0b3b8c,#1550b4);color:#fff;padding:14px 16px 12px}
  header h1{font-size:17px;font-weight:700;letter-spacing:.5px}
  .meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11.5px;opacity:.92;flex-wrap:wrap}
  .meta .dot{width:6px;height:6px;border-radius:50%;background:#7ef0b2;flex:none}
  .meta button{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:999px;padding:2px 10px;font-size:11px}
  .bar{position:sticky;top:0;z-index:8;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
  .row::-webkit-scrollbar{display:none}
  .rl{flex:none;font-size:11px;color:var(--sub);padding:4px 2px 4px 0;letter-spacing:.5px}
  .chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:12px;color:var(--sub)}
  .chip.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
  .search{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;background:#fff;margin-bottom:8px}
  main{padding:10px 12px 90px;max-width:720px;margin:0 auto}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
  .panel h2{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .seg{display:flex;gap:4px}
  .seg span{border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:11px;color:var(--sub);cursor:pointer}
  .seg span.on{background:var(--blue2,#e8eefb);border-color:var(--blue);color:var(--blue);font-weight:600}
  .chartbox{height:170px;position:relative}
  .chartbox .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;margin-bottom:10px;cursor:pointer}
  .t1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .t1>div{min-width:0}
  .nm{font-size:15px;font-weight:700;word-break:break-all}
  .cd{font-size:11px;color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
  .yld{text-align:right;flex:none}
  .yld b{font-size:20px;color:var(--red);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .yld span{display:block;font-size:10.5px;color:var(--sub)}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 7px}
  .bd{font-size:11px;border-radius:6px;padding:2px 8px;font-weight:600}
  .bd.r1{background:#e7f6ec;color:var(--green)}
  .bd.r2{background:#e8eefb;color:var(--blue)}
  .bd.is{background:#fdf3e0;color:var(--amber)}
  .bd.hd{background:#eef2f7;color:#475467}
  .ln{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--sub);padding:3px 0;border-top:1px dashed var(--line)}
  .ln span{flex:none}
  .ln b{color:var(--ink);font-weight:600;text-align:right;min-width:0;max-width:62%;word-break:break-all}
  .delta{font-size:11px;font-weight:700}
  .delta.up{color:var(--red)} .delta.dn{color:var(--green)} .delta.fl{color:var(--sub)}
  .tags{margin-top:6px;font-size:11px;color:var(--amber)}
  .sheet{position:fixed;inset:0;z-index:20;display:none}
  .sheet.on{display:block}
  .sheet .mask{position:absolute;inset:0;background:rgba(0,0,0,.4)}
  .sheet .box{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow:auto}
  .sheet h3{font-size:16px;font-weight:700;margin-bottom:4px}
  .sheet .sub{font-size:11.5px;color:var(--sub);margin-bottom:10px}
  .sheet .chartbox{height:200px;margin-top:6px}
  footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:8px 14px calc(8px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--sub);text-align:center}
  .empty{text-align:center;color:var(--sub);padding:60px 0;font-size:13px}
  @media (max-width:420px){ .yld b{font-size:18px} .ln{flex-direction:column;gap:0} .ln b{max-width:100%;text-align:left} }
</style>
</head>
<body>
<header>
  <h1>短钱理财筛 · 低风险 · 灵活赎</h1>
  <div class="meta">
    <span class="dot"></span><span id="stamp">加载中…</span>
    <button id="refresh">手动刷新</button>
    <span id="next"></span>
  </div>
</header>
<div class="bar">
  <input class="search" id="q" placeholder="搜索产品名 / 代码 / 理财子公司">
  <div class="row" id="f-issuer"></div>
  <div class="row" id="f-risk"></div>
  <div class="row" id="f-hold"></div>
  <div class="row" id="f-ctx"></div>
  <div class="row" id="f-tx"></div>
</div>
<main>
  <div class="panel" id="summary-panel" style="display:none">
    <h2 style="color:#0b3b8c">📊 近期优选推荐</h2>
    <div id="summary-content" style="font-size:13px;line-height:1.8;color:#344050"></div>
  </div>
  <div class="panel" id="upPanel" style="display:none">
    <h2>即将首发预览（募集档期）</h2>
    <div id="upList"></div>
  </div>
  <div class="panel">
    <h2>市场中位收益走势（R1 / R2 短钱池）
      <span class="seg" id="seg-mkt"><span data-g="d" class="on">日</span><span data-g="w">周</span><span data-g="m">月</span></span>
    </h2>
    <div class="chartbox"><canvas id="mktChart"></canvas><div class="ph" id="mktPh" style="display:none"></div></div>
  </div>
  <div id="list"></div>
</main>
<div class="sheet" id="sheet">
  <div class="mask" data-close="1"></div>
  <div class="box">
    <h3 id="dName"></h3>
    <div class="sub" id="dSub"></div>
    <div class="seg" id="seg-det" style="margin-bottom:4px">
      <span data-g="d" class="on">日</span><span data-g="w">周</span><span data-g="m">月</span>
      <span data-p="7" style="margin-left:8px">近7期</span><span data-p="30" class="on">近30期</span><span data-p="90">近90期</span>
    </div>
    <div class="chartbox"><canvas id="detChart"></canvas><div class="ph" id="detPh" style="display:none"></div></div>
    <div id="dInfo" style="margin-top:10px"></div>
  </div>
</div>
<footer>
  <div style="margin-bottom:2px">T+X＝申请日（工作日15:30前为当日）后第X个工作日：赎回=资金到账、购入=份额确认/起息；节假日顺延。</div>
  <div id="footer-content" style="line-height:1.6">
    数据来源：<a id="source-link" href="https://mobile.cmbchina.com/IEntrustFinance/financeproduct/financelist.html?PrdTyp=B" target="_blank" style="color:#0b3b8c">招商银行APP代销理财公开接口</a> · 仅供参考，不构成投资建议<br>理财非存款，产品有风险，投资需谨慎
  </div>
</footer>
<script>document.write('<script src="data.js?t='+Date.now()+'"><\/script>');</script>
<script>
(function(){
  var DATA = window.WM_DATA || {products:[], generated_at:"无数据", market:{dates:[],r1:[],r2:[]}};
  var HIST = null;
  var REFRESH_MS = 30*60*1000;
  var state = {issuer:"全部", risk:"全部", hold:"全部", ctx:"全部", tx:"全部", q:""};
  var mktG = "d", detG = "d", detP = 30, detCode = null;
  var mktChart = null, detChart = null;
  function el(id){return document.getElementById(id)}
  function yv(p){ var f=parseFloat(p.yield_pct); return isNaN(f)?-1:f; }

  /* ── 聚合：d 原样 / w 按 ISO 周 / m 按月，取每期最后一个值 ── */
  function isoWeek(ds){ var d=new Date(ds); d.setHours(0,0,0,0); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); var w1=new Date(d.getFullYear(),0,4); return d.getFullYear()+"W"+(1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7)); }
  function keyOf(ds,g){ return g==="d"?ds : g==="w"?isoWeek(ds) : ds.slice(0,7); }
  function agg(dates, vals, g){
    var m={}, order=[];
    dates.forEach(function(d,i){ var k=keyOf(d,g); if(!(k in m)){m[k]=[];order.push(k);} if(vals[i]!=null) m[k].push(vals[i]); });
    return {labels:order, values:order.map(function(k){ var a=m[k]; return a.length? a[a.length-1] : null; })};
  }
  function drawChart(canvas, ph, labels, series, yTitle){
    var box = canvas.parentElement;
    var real = labels.length>=2 && series.some(function(s){return s.data.some(function(v){return v!=null});});
    ph.style.display = real? "none":"flex";
    if(!real){ ph.textContent = "图表将随每日快照自动生长（当前 "+labels.length+" 期数据）"; if(canvas.chart){canvas.chart.destroy();canvas.chart=null;} return; }
    if(canvas.chart) canvas.chart.destroy();
    canvas.chart = new Chart(canvas, {type:"line", data:{labels:labels, datasets:series.map(function(s,i){return {label:s.label,data:s.data,borderColor:i? "#0b3b8c":"#1e7e46",backgroundColor:i? "rgba(11,59,140,.08)":"rgba(30,126,70,.08)",fill:true,tension:.3,pointRadius:2,borderWidth:2,spanGaps:true};})},
      options:{maintainAspectRatio:false, plugins:{legend:{labels:{boxWidth:10,font:{size:10}}}}, scales:{x:{ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:6}},y:{title:{display:true,text:yTitle,font:{size:9}},ticks:{font:{size:9}}}}}});
  }
  function renderMkt(){
    var m = DATA.market||{dates:[],r1:[],r2:[]};
    var a = agg(m.dates,m.r1,mktG), b = agg(m.dates,m.r2,mktG);
    drawChart(el("mktChart"), el("mktPh"), a.labels, [{label:"R1 中位",data:a.values},{label:"R2 中位",data:b.values}], "年化 %");
  }
  function renderSummary(){
    var products = DATA.products || [];
    if(!products.length) return;
    // 按银行分组，取每家最高收益产品
    var bankMap = {};
    products.forEach(function(p){
      if(!bankMap[p.issuer]) bankMap[p.issuer] = [];
      bankMap[p.issuer].push(p);
    });
    var bankBest = Object.keys(bankMap).map(function(bank){
      var best = bankMap[bank].slice().sort(function(a,b){return yv(b)-yv(a)})[0];
      return {bank:bank, best:best, count:bankMap[bank].length, avgYield: bankMap[bank].reduce(function(s,p){return s+yv(p)},0)/bankMap[bank].length};
    }).sort(function(a,b){return yv(b.best)-yv(a.best)});

    var priorityBanks = ["工商银行","招商银行"];
    var html = '<div style="margin-bottom:10px;padding:10px 12px;background:#f0f5ff;border-radius:10px;border-left:3px solid #0b3b8c">';
    html += '<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#0b3b8c">🏦 重点银行速览</div>';
    priorityBanks.forEach(function(bank){
      var info = bankMap[bank];
      if(!info || !info.length) return;
      var top = info.slice().sort(function(a,b){return yv(b)-yv(a)})[0];
      var top2 = info.length>1 ? info.slice().sort(function(a,b){return yv(b)-yv(a)})[1] : null;
      html += '<div style="margin-bottom:6px"><b>'+bank+'</b>（共'+info.length+'款）：';
      html += '<span style="color:#c0392b;font-weight:700">'+top.name+' '+top.yield_pct+'</span>';
      html += '<span style="color:#667085;font-size:11px">（'+top.yield_type+'，'+top.holding_desc+'）</span>';
      if(top2){
        html += '、<span style="color:#c0392b;font-weight:700">'+top2.name+' '+top2.yield_pct+'</span>';
        html += '<span style="color:#667085;font-size:11px">（'+top2.yield_type+'，'+top2.holding_desc+'）</span>';
      }
      html += '</div>';
    });
    html += '</div>';

    // 全市场 Top 3
    html += '<div style="margin-bottom:8px;font-weight:700;font-size:13px">🔥 全市场收益 Top 3</div>';
    var sorted = products.slice().sort(function(a,b){return yv(b)-yv(a)});
    for(var i=0;i<Math.min(3,sorted.length);i++){
      var p=sorted[i];
      html += '<div style="padding:4px 0;border-bottom:1px dashed #e6e8ec">';
      html += '<span style="display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#0b3b8c;color:#fff;font-size:11px;font-weight:700;margin-right:6px">'+(i+1)+'</span>';
      html += '<b>'+p.name+'</b> · '+p.issuer+' · <span style="color:#c0392b;font-weight:700">'+p.yield_pct+'</span>';
      html += '<span style="color:#667085;font-size:11px">（'+p.yield_type+'，'+p.holding_desc+'）</span>';
      html += '</div>';
    }

    // 数据来源说明
    html += '<div style="margin-top:10px;padding:8px 10px;background:#f9fafb;border-radius:8px;font-size:11px;color:#667085;line-height:1.6">';
    html += '📋 <b>数据来源</b>：<a href="'+(DATA.source_url||'https://mobile.cmbchina.com/IEntrustFinance/financeproduct/financelist.html?PrdTyp=B')+'" target="_blank" style="color:#0b3b8c">招商银行APP代销理财公开接口</a>';
    html += '，收益率等数据由各银行理财子公司官方披露。';
    if(DATA.disclaimer) html += '<br>⚠️ '+DATA.disclaimer;
    html += '</div>';

    el("summary-content").innerHTML = html;
    el("summary-panel").style.display = "block";
    // 更新 footer source link
    if(DATA.source_url){ var sl=el("source-link"); if(sl) sl.href=DATA.source_url; }
  }
  function loadHist(cb){
    if(HIST!==null) return cb(HIST);
    if(location.protocol!=="http:"&&location.protocol!=="https:"){ HIST={}; return cb(HIST); }
    fetch("history.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){HIST=j;cb(j)}).catch(function(){HIST={};cb(HIST)});
  }
  function openDetail(p){
    detCode=p.code;
    el("dName").textContent=p.name+"  "+p.yield_pct;
    el("dSub").textContent=p.code+" · "+p.issuer+" · "+(p.risk||"风险未披露")+" · "+(p.holding_days===0?"每日可赎":"最短持有"+p.holding_days+"天")+" · "+p.holding_desc;
    el("dInfo").innerHTML='<div class="ln"><span>收益口径</span><b>'+p.yield_type+'</b></div>'+(p.buy_rule?'<div class="ln"><span>购买时间</span><b>'+p.buy_rule+'</b></div>':'')+(p.confirm_rule?'<div class="ln"><span>确认份额</span><b>'+p.confirm_rule+'</b></div>':'')+(p.redeem_rule?'<div class="ln"><span>赎回到账</span><b>'+p.redeem_rule+'</b></div>':'')+(p.fees?'<div class="ln"><span>费用</span><b>'+p.fees+'</b></div>':'')+(p.win_yields&&Object.keys(p.win_yields).length?'<div class="ln"><span>区间年化</span><b>'+Object.keys(p.win_yields).slice(0,4).map(function(k){return k+" "+p.win_yields[k]}).join(" · ")+'</b></div>':'')+'<div class="ln"><span>起购/说明</span><b>'+(p.min_buy?p.min_buy+"元起购":"—")+" · "+p.note+'</b></div>'+(p.tags&&p.tags.length?'<div class="tags">'+p.tags.join(" · ")+'</div>':'');
    el("sheet").classList.add("on");
    renderDet();
  }
  function renderDet(){
    loadHist(function(h){
      var rows = h[detCode]||[];
      rows = rows.slice(-detP);
      var useNav = !rows.some(function(r){return r.s7!=null && r.s7!==0;});
      var a = agg(rows.map(function(r){return r.d}), rows.map(function(r){ var f = useNav? r.nav : (r.s7||null); return f==null? null : parseFloat(f); }), detG);
      drawChart(el("detChart"), el("detPh"), a.labels, [{label: useNav? "单位净值":"七日年化(%)", data:a.values}], useNav? "净值":"年化 %");
    });
  }
  function chips(box, items, key, label){
    el(box).innerHTML = (label?'<span class="rl">'+label+'</span>':'') + items.map(function(v){ return '<span class="chip'+(state[key]===v?' on':'')+'" data-k="'+key+'" data-v="'+v+'">'+v+'</span>'; }).join("");
  }
  function renderChips(){
    var issuers=["全部"]; DATA.products.forEach(function(p){ if(issuers.indexOf(p.issuer)<0) issuers.push(p.issuer); });
    chips("f-issuer", issuers, "issuer", "发行方");
    chips("f-risk", ["全部","R1","R2"], "risk", "风险");
    chips("f-hold", ["全部","每日可赎","≤7天","≤14天","≤30天"], "hold", "持有期");
    chips("f-ctx", ["全部","T+0","T+1","T+2+"], "ctx", "购入确认");
    chips("f-tx", ["全部","T+0","T+1","T+2","T+3+"], "tx", "赎回到账");
  }
  function ctxMatch(p){
    if(state.ctx==="全部") return true;
    var t=p.confirm_tx;
    if(t===null||t===undefined) return false;
    if(state.ctx==="T+0") return t===0;
    if(state.ctx==="T+1") return t===1;
    if(state.ctx==="T+2+") return t>=2;
    return true;
  }
  function txMatch(p){
    if(state.tx==="全部") return true;
    var t=p.redeem_tx;
    if(t===null||t===undefined) return false;
    if(state.tx==="T+0") return t===0;
    if(state.tx==="T+1") return t===1;
    if(state.tx==="T+2") return t===2;
    if(state.tx==="T+3+") return t>=3;
    return true;
  }
  function holdMatch(p){
    if(state.hold==="全部") return true;
    var d=p.holding_days;
    if(state.hold==="每日可赎") return d===0;
    if(state.hold==="≤7天") return d!==null&&d<=7;
    if(state.hold==="≤14天") return d!==null&&d<=14;
    return d!==null&&d<=30;
  }
  function render(){
    var list = DATA.products.filter(function(p){
      return (state.issuer==="全部"||p.issuer===state.issuer)&&(state.risk==="全部"||p.risk===state.risk)&&holdMatch(p)&&ctxMatch(p)&&txMatch(p)&&(!state.q||(p.name+p.code+p.issuer).toLowerCase().indexOf(state.q.toLowerCase())>=0);
    }).sort(function(a,b){
      var pa=["工商银行","招商银行"], ia=pa.indexOf(a.issuer), ib=pa.indexOf(b.issuer);
      if(ia>=0&&ib>=0) return ia!==ib ? ia-ib : yv(b)-yv(a);
      if(ia>=0) return -1;
      if(ib>=0) return 1;
      return yv(b)-yv(a);
    });
    el("list").innerHTML = list.length? list.map(function(p,i){
      var d="";
      if(p.prev_yield_pct&&p.prev_yield_pct!==p.yield_pct){ var df=(yv(p)-parseFloat(p.prev_yield_pct)).toFixed(2); d=df>0?'<span class="delta up">↑'+df+'</span>':df<0?'<span class="delta dn">↓'+Math.abs(df)+'</span>':'<span class="delta fl">＝</span>'; }
      return '<div class="card" data-i="'+i+'"><div class="t1"><div><div class="nm">'+p.name+'</div><div class="cd">'+p.code+' · '+p.channel+'</div></div><div class="yld"><b>'+p.yield_pct+'</b><span>'+p.yield_type+' '+d+'</span></div></div><div class="badges"><span class="bd '+(p.risk?p.risk.toLowerCase():"hd")+'">'+(p.risk||"风险未披露")+'</span><span class="bd is">'+p.issuer+'</span><span class="bd hd">'+(p.holding_days===0?"每日可赎":"最短持有"+p.holding_days+"天")+'</span></div><div class="ln"><span>赎回规则</span><b>'+p.holding_desc+'</b></div><div class="ln"><span>起购 / 说明</span><b>'+(p.min_buy?p.min_buy+"元起购":"—")+' · '+p.note+'</b></div>'
      +(p.redeem_tx!=null||p.confirm_tx!=null||p.fees?'<div class="ln"><span>购入 / 赎回</span><b>'+(p.confirm_tx!=null?"购入确认T+"+p.confirm_tx:"购入见详情")+" · "+(p.redeem_tx!=null?"赎回到账T+"+p.redeem_tx:"赎回见详情")+(p.fees?" · "+p.fees:"")+'</b></div>':'')+(p.tags&&p.tags.length?'<div class="tags">'+p.tags.join(" · ")+'</div>':'')+'</div>';
    }).join("") : '<div class="empty">没有符合筛选条件的产品</div>';
    window._list=list;
  }
  function renderUp(){
    var up = (DATA.upcoming||[]).slice().sort(function(a,b){ var ka=(a.kind==="upcoming"?0:1), kb=(b.kind==="upcoming"?0:1); return ka!==kb? ka-kb : ((a.sale_date||"9999")<(b.sale_date||"9999")?-1:1); });
    if(!up.length){ el("upPanel").style.display="none"; return; }
    el("upPanel").style.display="";
    var today = new Date(); today.setHours(0,0,0,0);
    el("upList").innerHTML = up.slice(0,8).map(function(u){
      var days="";
      if(u.sale_date){ var d=new Date(u.sale_date+"T00:00:00"); var df=Math.round((d-today)/86400000); days = df===0?"今天开售":df>0?df+"天后开售":"募集中"; }
      return '<div class="ln"><span><b style="color:var(--ink)">'+u.name+'</b> <span class="bd '+String(u.risk||"").toLowerCase()+'" style="margin-left:4px">'+(u.risk||"—")+'</span> <span class="bd is">'+u.issuer+'</span></span><b>'+u.sale_text+(days?" · "+days:"")+' · '+u.holding_desc+'</b></div>';
    }).join("");
  }
  function stamp(){ el("stamp").textContent="数据截至 "+DATA.generated_at+" · 共 "+DATA.count_kept+" 只（原始 "+DATA.count_total_raw+" 只）"; }
  function load(){
    if(location.protocol==="http:"||location.protocol==="https:"){
      fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){ DATA=j; window.WM_DATA=j; HIST=null; renderChips(); render(); renderSummary(); stamp(); renderMkt(); renderUp(); }).catch(function(){});
    } else { renderChips(); render(); renderSummary(); stamp(); renderMkt(); renderUp(); }
  }
  var lastTick=Date.now();
  function tick(){ lastTick=Date.now(); el("next").textContent="· "+Math.round(REFRESH_MS/60000)+"分钟后自动检查更新"; }
  setInterval(function(){ load(); tick(); }, REFRESH_MS);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden&&Date.now()-lastTick>60000) load(); });
  document.addEventListener("click", function(e){
    if(e.target.dataset.close){ el("sheet").classList.remove("on"); return; }
    var seg=e.target.closest(".seg span");
    if(seg){
      if(seg.parentElement.id==="seg-mkt"){ mktG=seg.dataset.g; seg.parentElement.querySelectorAll("span").forEach(function(s){s.classList.toggle("on",s===seg)}); renderMkt(); }
      else { if(seg.dataset.g){detG=seg.dataset.g;} if(seg.dataset.p){detP=+seg.dataset.p;} seg.parentElement.querySelectorAll("span").forEach(function(s){ if(s.dataset.g) s.classList.toggle("on", s===seg&&!!seg.dataset.g); if(s.dataset.p) s.classList.toggle("on", s===seg&&!!seg.dataset.p); }); renderDet(); }
      return;
    }
    var c=e.target.closest(".chip"); if(c){ state[c.dataset.k]=c.dataset.v; renderChips(); render(); return; }
    var card=e.target.closest(".card"); if(card){ openDetail(window._list[+card.dataset.i]); }
  });
  el("q").addEventListener("input", function(e){ state.q=e.target.value.trim(); render(); });
  el("refresh").addEventListener("click", load);
  load(); tick();
  // 深链：?detail=产品代码 自动打开详情弹层
  var dc = new URLSearchParams(location.search).get("detail");
  if (dc) setTimeout(function(){ var p = (window._list||[]).filter(function(x){return x.code===dc})[0] || DATA.products.filter(function(x){return x.code===dc})[0]; if(p) openDetail(p); }, 300);
})();
</script>
</body>
</html>
